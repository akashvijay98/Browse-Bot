<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 98vh; margin: 0; padding: 10px; box-sizing: border-box; }
    #chat-history { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
    .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
    .user-msg { background-color: #007bff; color: white; text-align: right; margin-left: 20px;}
    .agent-msg { background-color: #f1f1f1; color: black; margin-right: 20px;}
    .input-area { display: flex; gap: 5px; }
    input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat-history">
    <div class="message agent-msg">Hi! Open a tab and tell me what you want to do.</div>
  </div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="e.g., Summarize this page...">
    <button id="send-btn">Send</button>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
